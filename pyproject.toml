[project]
name = "saj-modbus"
version = "0.8.0"
description = "Read (and control) SAJ PLUS / R5 / R6 solar inverters over Modbus. C6 excluded. Built from the SAJ Modbus PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "modbus-connection[tmodbus]>=4.8.1",
]

[project.optional-dependencies]
cli = []
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["saj_modbus*"]

[tool.ruff.lint.per-file-ignores]
# naive datetimes in tests are vectors, not clock handling
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
