name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 pins the floor we promise in requires-python; >=3.12 floats
        # to the newest stable (3.14 today, 3.15 once released).
        python-version: ["3.12", ">=3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest>=8 ruff
      - name: Lint
        run: ruff check saj_modbus tests
      - name: Run tests
        run: python -m pytest tests/ -q
